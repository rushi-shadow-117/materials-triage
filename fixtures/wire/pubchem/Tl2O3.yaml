    body:
      string: "{\n  \"Record\": {\n    \"RecordType\": \"CID\",\n    \"RecordNumber\":
        3579754,\n    \"RecordTitle\": \"Thallium(III) oxide\",\n    \"Section\":
        [\n      {\n        \"TOCHeading\": \"Safety and Hazards\",\n        \"Description\":
        \"Information on safety and hazards for this compound, including safety/hazards
        properties, reactivity, incompatibilities, management techniques, first aid
        treatments, and more.  For toxicity and related information, please see the
        Toxicity section.\",\n        \"Section\": [\n          {\n            \"TOCHeading\":
        \"Hazards Identification\",\n            \"Description\": \"This section identifies
        the hazards of the chemical presented on the safety data sheet (SDS) and the
        appropriate warning information associated with those hazards.  The information
        in this section includes, but are not limited to, the hazard classification
        of the chemical, signal word, pictograms, hazard statements and precautionary
        statements.\",\n            \"URL\": \"https://www.osha.gov/sites/default/files/publications/OSHA3514.pdf\",\n
        \           \"Section\": [\n              {\n                \"TOCHeading\":
        \"GHS Classification\",\n                \"Description\": \"GHS (Globally
        Harmonized System of Classification and Labelling of Chemicals) is a United
        Nations system to identify hazardous chemicals and to inform users about these
        hazards. GHS has been adopted by many countries around the world and is now
        also used as the basis for international and national transport regulations
        for dangerous goods. The GHS hazard statements, class categories, pictograms,
        signal words, and the precautionary statements can be found on the PubChem
        GHS page.\",\n                \"URL\": \"https://pubchem.ncbi.nlm.nih.gov/ghs/\",\n
        \               \"DisplayControls\": {\n                  \"CreateTable\":
        {\n                    \"FromInformationIn\": \"ThisSection\",\n                    \"NumberOfColumns\":
        2,\n                    \"ColumnContents\": [\n                      \"Name\",\n
        \                     \"Value\"\n                    ]\n                  },\n
        \                 \"ShowAtMost\": 1\n                },\n                \"Information\":
        [\n                  {\n                    \"ReferenceNumber\": 7,\n                    \"Name\":
        \"GHS Hazard Statements\",\n                    \"Value\": {\n                      \"StringWithMarkup\":
        [\n                        {\n                          \"String\": \"Not
        Classified\"\n                        }\n                      ]\n                    }\n
        \                 }\n                ]\n              }\n            ]\n          }\n
        \       ]\n      }\n    ],\n    \"Reference\": [\n      {\n        \"ReferenceNumber\":
        7,\n        \"SourceName\": \"NITE-CMC\",\n        \"SourceID\": \"R03_C_162A_MOE\",\n
        \       \"Name\": \"Thallium(III) oxide - FY2021 (New/original classication)\",\n
        \       \"Description\": \"The chemical classification in this section was
        conducted by the Chemical Management Center (CMC) of Japan National Institute
        of Technology and Evaluation (NITE) in accordance with GHS Classification
        Guidance for the Japanese Government, and is intended to provide a reference
        for preparing GHS labelling and SDS for users.\",\n        \"URL\": \"https://www.chem-info.nite.go.jp/chem/english/ghs/21-moe-0162e.html\",\n
        \       \"LicenseURL\": \"https://www.chem-info.nite.go.jp/en/chem/chrip/chrip_search/html/condUse.html\",\n
