        pressure in kilopascals at which the unit cell parameters were measured.\",\"type\":\"float\"},\"_cod_celltemp\":{\"description\":\"The
        temperature in kelvins at which the unit cell parameters were measured (not
        the temperature of synthesis).\",\"type\":\"float\"},\"_cod_chemname\":{\"description\":\"IUPAC
        or Chemical Abstracts full name of the compound.\",\"type\":\"string\"},\"_cod_commonname\":{\"description\":\"Trivial
        name by which the compound in the crystal is commonly known.\",\"type\":\"string\"},\"_cod_compoundsource\":{\"description\":\"The
        description of the source of the compound (or a parent molecule). Includes
        the place of discovery (for minerals) or the actual source (for natural products).\",\"type\":\"string\"},\"_cod_date\":{\"description\":\"The
        date the current row of the table was inserted to the COD database.\",\"type\":\"string\"},\"_cod_diffrpressure\":{\"description\":\"The
        mean hydrostatic pressure in kilopascals at which the intensities were measured.\",\"type\":\"float\"},\"_cod_diffrtemp\":{\"description\":\"The
        mean temperature in kelvins at which the diffraction intensities were measured.\",\"type\":\"float\"},\"_cod_doi\":{\"description\":\"The
        DOI that links to the online paper where the crystal was published.\",\"type\":\"string\"},\"_cod_duplicateof\":{\"description\":\"Specifies
        that the COD entry containing this data item is considered to be a duplicate
        of another entry. The COD number of this other entry, which is considered
        to be \\\"primary\\\" entry for the structure, is specified as a value of
        this column.\",\"type\":\"integer\"},\"_cod_firstpage\":{\"description\":\"The
        first page of the scientific paper where the crystal structure was published.\",\"type\":\"string\"},\"_cod_flags\":{\"description\":\"A
        set (as in SQL or Pascal) that describes various conditions of a COD record:
        \\\"has coordinates\\\": the entry has atomic coordinates specified; \\\"has
        disorder\\\": some atoms were modeled as disordered in the unit cell of this
        entry; \\\"has Fobs\\\": there is a corresponding X-ray reflection file (Fobs
        or Iobs data) in the COD for this entry, containing the original reflection
        intensities used to determine this structure.\",\"type\":\"string\"},\"_cod_gamma\":{\"description\":\"The
        lattice parameter gamma of the crystal structure.\",\"type\":\"float\"},\"_cod_gofall\":{\"description\":\"The
        least-squares goodness-of-fit parameter S for all reflections after the final
        cycle of refinement.\",\"type\":\"float\"},\"_cod_gofgt\":{\"description\":\"NOTE:
        the field stores the same information as the \\\"gofobs\\\" field, however,
        it should not be removed in order to retain compatibility with existing software.
        The least-squares goodness-of-fit parameter S for significantly intense reflections
        (see _reflns_threshold_expression) after the final cycle of refinement.\",\"type\":\"float\"},\"_cod_gofobs\":{\"description\":\"NOTE:
        the field stores the same information as the \\\"gofgt\\\" field, however,
        it should not be removed in order to retain compatibility with existing software.
        The least-squares goodness-of-fit parameter S for significantly intense reflections
        (see _reflns_threshold_expression) after the final cycle of refinement.\",\"type\":\"float\"},\"_cod_gofref\":{\"description\":\"The
        least-squares goodness-of-fit parameter S for all reflections included in
        the refinement after the final cycle of refinement.\",\"type\":\"float\"},\"_cod_issue\":{\"description\":\"The
        issue of the journal where the scientific paper describing the crystal structure
