        last page of the scientific paper where the crystal structure was published.\",\"type\":\"string\"},\"_cod_method\":{\"description\":\"The
        method that was used to determine the crystal structure.\",\"type\":\"string\"},\"_cod_mineral\":{\"description\":\"Mineral
        name accepted by the International Mineralogical Association.\",\"type\":\"string\"},\"_cod_onhold\":{\"description\":\"Specifies
        the date when the atomic coordinates of the entry, which might be currently
        on hold (not public), will become available publicly.\",\"type\":\"string\"},\"_cod_optimal\":{\"description\":\"Contains
        a COD database code for the COD entry that contains optimally solved structure
        for the crystal or compound under consideration. This optimal structure should
        be used for all inferences; the current suboptimal structure is provided for
        illustration purposes only.\",\"type\":\"integer\"},\"_cod_pressurehist\":{\"description\":\"The
        pressure history of the crystal (human-readable informal description).\",\"type\":\"string\"},\"_cod_radiation\":{\"description\":\"The
        type of radiation that was used to determine the crystal structure.\",\"type\":\"string\"},\"_cod_radsymbol\":{\"description\":\"The
        IUPAC symbol for the X-ray wavelength for the probe radiation.\",\"type\":\"string\"},\"_cod_radtype\":{\"description\":\"The
        type of the radiation used to determine the structure of the crystal. This
        is used to give a more detailed description than _diffrn_radiation_probe and
        is typically a description of the X-ray wavelength in Siegbahn notation.\",\"type\":\"string\"},\"_cod_rall\":{\"description\":\"Residual
        factor for all reflections satisfying the resolution limits established by
        _refine_ls_d_res_high and _refine_ls_d_res_low.\",\"type\":\"float\"},\"_cod_rfsqd\":{\"description\":\"Residual
        factor R(Fsqd), calculated on the squared amplitudes of the observed and calculated
        structure factors, for significantly intense reflections (satisfying _reflns_threshold_expression)
        and included in the refinement.\",\"type\":\"float\"},\"_cod_ri\":{\"description\":\"Residual
        factor R(I) for significantly intense reflections (satisfying _reflns_threshold_expression)
        and included in the refinement. This is most often calculated in Rietveld
        refinements against powder data, where it is referred to as R~B~ or R~Bragg~.\",\"type\":\"float\"},\"_cod_robs\":{\"description\":\"Residual
        factor for the reflections (with number given by _reflns_number_gt) judged
        significantly intense (i.e. satisfying the threshold specified by _reflns_threshold_expression)
        and included in the refinement. The reflections also satisfy the resolution
        limits established by _refine_ls_d_res_high and _refine_ls_d_res_low. This
        is the conventional R factor.\",\"type\":\"float\"},\"_cod_rref\":{\"description\":\"This
        data value is not described in official IUCr dictionaries, but many CIF files
        use it. Should be roughly equivalent to Robs.\",\"type\":\"float\"},\"_cod_sg\":{\"description\":\"Space
        group symbol, Hermann-Mauguin or superspace group symbol.\",\"type\":\"string\"},\"_cod_sghall\":{\"description\":\"Space
        group symbol as described by Hall.\",\"type\":\"string\"},\"_cod_sgnumber\":{\"description\":\"The
        space group number as assigned in International Tables for Crystallography
        Vol. A.\",\"type\":\"integer\"},\"_cod_siga\":{\"description\":\"The standard
        uncertainty of the lattice parameter a of the crystal structure.\",\"type\":\"float\"},\"_cod_sigalpha\":{\"description\":\"The
        standard uncertainty of the lattice parameter alpha of the crystal structure.\",\"type\":\"float\"},\"_cod_sigb\":{\"description\":\"The
        standard uncertainty of the lattice parameter b of the crystal structure.\",\"type\":\"float\"},\"_cod_sigbeta\":{\"description\":\"The
        standard uncertainty of the lattice parameter beta of the crystal structure.\",\"type\":\"float\"},\"_cod_sigc\":{\"description\":\"The
        standard uncertainty of the lattice parameter c of the crystal structure.\",\"type\":\"float\"},\"_cod_sigcellpressure\":{\"description\":\"The
        standard uncertainty of the 'cellpressure' value.\",\"type\":\"float\"},\"_cod_sigcelltemp\":{\"description\":\"The
        standard uncertainty of the temperature at which the crystal structure was
        determined.\",\"type\":\"float\"},\"_cod_sigdiffrpressure\":{\"description\":\"The
        standard uncertainty of the 'diffrpressure' value.\",\"type\":\"float\"},\"_cod_sigdiffrtemp\":{\"description\":\"The
        standard uncertainty of the 'diffrtemp' value.\",\"type\":\"float\"},\"_cod_siggamma\":{\"description\":\"The
        standard uncertainty of the lattice parameter gamma of the crystal structure.\",\"type\":\"float\"},\"_cod_sigvol\":{\"description\":\"The
        standard uncertainty of the volume of the crystal structure.\",\"type\":\"float\"},\"_cod_smiles\":{\"description\":\"The
        SMILES (Simplified Molecular Input Line Entry Specification) descriptor for
        the structure.\",\"type\":\"string\"},\"_cod_status\":{\"description\":\"Describes
        the severity of errors if such are detected in COD entries. Permitted values
        are: NULL, 'warnings', 'errors', 'retracted'.\",\"type\":\"string\"},\"_cod_svnrevision\":{\"description\":\"The
        Subversion revision of the file that was used to produce the SQL table row.\",\"type\":\"integer\"},\"_cod_text\":{\"description\":\"A
        concatenation of all descriptive fields in the table: my $text = join( '\\\\n',
        map { Unicode2:cif2unicode($_) } ( $authors, $title, $journal, $volume . (
        $issue? ( $volume ? \\\"($issue)\\\" : \\\"(issue $issue)\\\") : \\\"\\\"
        ), \\\"(\\\" . $year . \\\")\\\", ( $last_page ? $first_page . \\\"-\\\" .
        $last_page : $first_page )) ); Retained here for compatibility with the first
        version of the COD.\",\"type\":\"string\"},\"_cod_thermalhist\":{\"description\":\"The
        thermal history of the crystal (human-readable informal description).\",\"type\":\"string\"},\"_cod_time\":{\"description\":\"The
        time the current row of the table was inserted to the COD database.\",\"type\":\"string\"},\"_cod_title\":{\"description\":\"The
        title of the scientific paper where the crystal structure was published.\",\"type\":\"string\"},\"_cod_vol\":{\"description\":\"The
        volume of the crystal structure (calculated by 'cod-tools' from the cell constants).\",\"type\":\"float\"},\"_cod_volume\":{\"description\":\"The
        volume of the journal where the scientific paper describing the crystal structure
        was published.\",\"type\":\"integer\"},\"_cod_wavelength\":{\"description\":\"The
        wavelength in \xE5ngstr\xF6ms that was used to determine the crystal structure.\",\"type\":\"float\"},\"_cod_wrall\":{\"description\":\"Weighted
        residual factors for all reflections.\",\"type\":\"float\"},\"_cod_wrobs\":{\"description\":\"Weighted
        residual factors for significantly intense reflections (satisfying _reflns_threshold_expression)
        included in the refinement.\",\"type\":\"float\"},\"_cod_wrref\":{\"description\":\"Weighted
        residual factors for all reflections included in the refinement.\",\"type\":\"float\"},\"_cod_year\":{\"description\":\"The
        year of publication of this crystal structure.\",\"type\":\"integer\"},\"_cod_z\":{\"description\":\"The
        number of the formula units in the unit cell.\",\"type\":\"integer\"},\"_cod_zprime\":{\"description\":\"The
        number of the formula units in the unit cell ('Z') divided by the number of
        independent general positions.\",\"type\":\"float\"},\"assemblies\":{\"description\":\"A
        description of groups of sites that are statistically correlated.\\n\\n- **Type**:
        list of dictionary with keys:\\n    - `sites_in_groups`: list of list of integers
        (REQUIRED)\\n    - `group_probabilities`: list of floats (REQUIRED)\\n\\n-
        **Requirements/Conventions**:\\n    - **Support**: OPTIONAL support in implementations,
        i.e., MAY be `null`.\\n    - **Query**: Support for queries on this property
        is OPTIONAL.\\n        If supported, filters MAY support only a subset of
        comparison operators.\\n    - The property SHOULD be `null` for entries that
        have no partial occupancies.\\n    - If present, the correct flag MUST be
        set in the list `structure_features`.\\n    - Client implementations MUST
        check its presence (as its presence changes the interpretation of the structure).\\n
        \   - If present, it MUST be a list of dictionaries, each of which represents
        an assembly and MUST have the following two keys:\\n        - **sites_in_groups**:
        Index of the sites (0-based) that belong to each group for each assembly.\\n\\n
        \           Example: `[[1], [2]]`: two groups, one with the second site, one
        with the third.\\n            Example: `[[1,2], [3]]`: one group with the
        second and third site, one with the fourth.\\n\\n        - **group_probabilities**:
        Statistical probability of each group. It MUST have the same length as `sites_in_groups`.\\n
        \           It SHOULD sum to one.\\n            See below for examples of
        how to specify the probability of the occurrence of a vacancy.\\n            The
        possible reasons for the values not to sum to one are the same as already
        specified above for the `concentration` of each `species`.\\n\\n    - If a
        site is not present in any group, it means that it is present with 100 % probability
        (as if no assembly was specified).\\n    - A site MUST NOT appear in more
        than one group.\\n\\n- **Examples** (for each entry of the assemblies list):\\n
        \   - `{\\\"sites_in_groups\\\": [[0], [1]], \\\"group_probabilities: [0.3,
        0.7]}`: the first site and the second site never occur at the same time in
        the unit cell.\\n        Statistically, 30 % of the times the first site is
        present, while 70 % of the times the second site is present.\\n    - `{\\\"sites_in_groups\\\":
        [[1,2], [3]], \\\"group_probabilities: [0.3, 0.7]}`: the second and third
        site are either present together or not present; they form the first group
        of atoms for this assembly.\\n        The second group is formed by the fourth
        site.\\n        Sites of the first group (the second and the third) are never
        present at the same time as the fourth site.\\n        30 % of times sites
        1 and 2 are present (and site 3 is absent); 70 % of times site 3 is present
        (and sites 1 and 2 are absent).\\n\\n- **Notes**:\\n    - Assemblies are essential
        to represent, for instance, the situation where an atom can statistically
        occupy two different positions (sites).\\n\\n    - By defining groups, it
        is possible to represent, e.g., the case where a functional molecule (and
        not just one atom) is either present or absent (or the case where it it is
        present in two conformations)\\n\\n    - Considerations on virtual alloys
        and on vacancies: In the special case of a virtual alloy, these specifications
        allow two different, equivalent ways of specifying them.\\n        For instance,
        for a site at the origin with 30 % probability of being occupied by Si, 50
        % probability of being occupied by Ge, and 20 % of being a vacancy, the following
        two representations are possible:\\n\\n        - Using a single species:\\n
        \           ```json\\n            {\\n              \\\"cartesian_site_positions\\\":
        [[0,0,0]],\\n              \\\"species_at_sites\\\": [\\\"SiGe-vac\\\"],\\n
        \             \\\"species\\\": [\\n              {\\n                \\\"name\\\":
        \\\"SiGe-vac\\\",\\n                \\\"chemical_symbols\\\": [\\\"Si\\\",
        \\\"Ge\\\", \\\"vacancy\\\"],\\n                \\\"concentration\\\": [0.3,
        0.5, 0.2]\\n              }\\n              ]\\n              // ...\\n            }\\n
        \           ```\\n\\n        - Using multiple species and the assemblies:\\n
        \           ```json\\n            {\\n              \\\"cartesian_site_positions\\\":
        [ [0,0,0], [0,0,0], [0,0,0] ],\\n              \\\"species_at_sites\\\": [\\\"Si\\\",
        \\\"Ge\\\", \\\"vac\\\"],\\n              \\\"species\\\": [\\n                {
        \\\"name\\\": \\\"Si\\\", \\\"chemical_symbols\\\": [\\\"Si\\\"], \\\"concentration\\\":
        [1.0] },\\n                { \\\"name\\\": \\\"Ge\\\", \\\"chemical_symbols\\\":
        [\\\"Ge\\\"], \\\"concentration\\\": [1.0] },\\n                { \\\"name\\\":
        \\\"vac\\\", \\\"chemical_symbols\\\": [\\\"vacancy\\\"], \\\"concentration\\\":
        [1.0] }\\n              ],\\n              \\\"assemblies\\\": [\\n                {\\n
        \             \\\"sites_in_groups\\\": [ [0], [1], [2] ],\\n              \\\"group_probabilities\\\":
        [0.3, 0.5, 0.2]\\n                }\\n              ]\\n              // ...\\n
        \           }\\n            ```\\n\\n    - It is up to the database provider
        to decide which representation to use, typically depending on the internal
        format in which the structure is stored.\\n        However, given a structure
        identified by a unique ID, the API implementation MUST always provide the
        same representation for it.\\n\\n    - The probabilities of occurrence of
        different assemblies are uncorrelated.\\n        So, for instance in the following
        case with two assemblies:\\n        ```json\\n        {\\n          \\\"assemblies\\\":
        [\\n            {\\n              \\\"sites_in_groups\\\": [ [0], [1] ],\\n
        \             \\\"group_probabilities\\\": [0.2, 0.8],\\n            },\\n
        \           {\\n              \\\"sites_in_groups\\\": [ [2], [3] ],\\n              \\\"group_probabilities\\\":
        [0.3, 0.7]\\n            }\\n          ]\\n        }\\n        ```\\n\\n        Site
        0 is present with a probability of 20 % and site 1 with a probability of 80
        %. These two sites are correlated (either site 0 or 1 is present). Similarly,
        site 2 is present with a probability of 30 % and site 3 with a probability
        of 70 %.\\n        These two sites are correlated (either site 2 or 3 is present).\\n
        \       However, the presence or absence of sites 0 and 1 is not correlated
        with the presence or absence of sites 2 and 3 (in the specific example, the
        pair of sites (0, 2) can occur with 0.2*0.3 = 6 % probability; the pair (0,
        3) with 0.2*0.7 = 14 % probability; the pair (1, 2) with 0.8*0.3 = 24 % probability;
        and the pair (1, 3) with 0.8*0.7 = 56 % probability).\",\"type\":\"list\"},\"cartesian_site_positions\":{\"description\":\"Cartesian
        positions of each site in the structure.\\nA site is usually used to describe
        positions of atoms; what atoms can be encountered at a given site is conveyed
        by the `species_at_sites` property, and the species themselves are described
        in the `species` property.\\n\\n- **Type**: list of list of floats\\n\\n-
        **Requirements/Conventions**:\\n    - **Support**: SHOULD be supported by
        all implementations, i.e., SHOULD NOT be `null`.\\n    - **Query**: Support
        for queries on this property is OPTIONAL.\\n      If supported, filters MAY
        support only a subset of comparison operators.\\n    - It MUST be a list of
        length equal to the number of sites in the structure, where every element
        is a list of the three Cartesian coordinates of a site expressed as float
        values in the unit angstrom (\xC5).\\n    - An entry MAY have multiple sites
        at the same Cartesian position (for a relevant use of this, see e.g., the
        property `assemblies`).\\n\\n- **Examples**:\\n    - `[[0,0,0],[0,0,2]]` indicates
        a structure with two sites, one sitting at the origin and one along the (positive)
        *z*-axis, 2 \xC5 away from the origin.\",\"type\":\"list\"},\"chemical_formula_anonymous\":{\"description\":\"The
        anonymous formula is the `chemical_formula_reduced`, but where the elements
        are instead first ordered by their chemical proportion number, and then, in
        order left to right, replaced by anonymous symbols A, B, C, ..., Z, Aa, Ba,
        ..., Za, Ab, Bb, ... and so on.\\n\\n- **Type**: string\\n\\n- **Requirements/Conventions**:\\n
        \   - **Support**: SHOULD be supported by all implementations, i.e., SHOULD
        NOT be `null`.\\n    - **Query**: MUST be a queryable property.\\n      However,
        support for filters using partial string matching with this property is OPTIONAL
        (i.e., BEGINS WITH, ENDS WITH, and CONTAINS).\\n\\n- **Examples**:\\n    -
        `\\\"A2B\\\"`\\n    - `\\\"A42B42C16D12E10F9G5\\\"`\\n\\n- **Querying**:\\n
        \   - A filter that matches an exactly given formula is `chemical_formula_anonymous=\\\"A2B\\\"`.\",\"type\":\"string\"},\"chemical_formula_descriptive\":{\"description\":\"The
        chemical formula for a structure as a string in a form chosen by the API implementation.\\n\\n-
        **Type**: string\\n\\n- **Requirements/Conventions**:\\n    - **Support**:
        SHOULD be supported by all implementations, i.e., SHOULD NOT be `null`.\\n
        \   - **Query**: MUST be a queryable property with support for all mandatory
        filter features.\\n    - The chemical formula is given as a string consisting
        of properly capitalized element symbols followed by integers or decimal numbers,
        balanced parentheses, square, and curly brackets `(`,`)`, `[`,`]`, `{`, `}`,
        commas, the `+`, `-`, `:` and `=` symbols. The parentheses are allowed to
        be followed by a number. Spaces are allowed anywhere except within chemical
        symbols. The order of elements and any groupings indicated by parentheses
        or brackets are chosen freely by the API implementation.\\n    - The string
        SHOULD be arithmetically consistent with the element ratios in the `chemical_formula_reduced`
        property.\\n    - It is RECOMMENDED, but not mandatory, that symbols, parentheses
        and brackets, if used, are used with the meanings prescribed by [IUPAC's Nomenclature
        of Organic Chemistry](https://www.qmul.ac.uk/sbcs/iupac/bibliog/blue.html).\\n\\n-
        **Examples**:\\n    - `\\\"(H2O)2 Na\\\"`\\n    - `\\\"NaCl\\\"`\\n    - `\\\"CaCO3\\\"`\\n
        \   - `\\\"CCaO3\\\"`\\n    - `\\\"(CH3)3N+ - [CH2]2-OH = Me3N+ - CH2 - CH2OH\\\"`\\n\\n-
        **Query examples**:\\n    - Note: the free-form nature of this property is
        likely to make queries on it across different databases inconsistent.\\n    -
        A filter that matches an exactly given formula: `chemical_formula_descriptive=\\\"(H2O)2
        Na\\\"`.\\n    - A filter that does a partial match: `chemical_formula_descriptive
        CONTAINS \\\"H2O\\\"`.\",\"type\":\"string\"},\"chemical_formula_hill\":{\"description\":\"The
        chemical formula for a structure in [Hill form](https://dx.doi.org/10.1021/ja02046a005)
        with element symbols followed by integer chemical proportion numbers. The
        proportion number MUST be omitted if it is 1.\\n\\n- **Type**: string\\n\\n-
        **Requirements/Conventions**:\\n    - **Support**: OPTIONAL support in implementations,
        i.e., MAY be `null`.\\n    - **Query**: Support for queries on this property
        is OPTIONAL.\\n      If supported, only a subset of the filter features MAY
        be supported.\\n    - The overall scale factor of the chemical proportions
        is chosen such that the resulting values are integers that indicate the most
        chemically relevant unit of which the system is composed.\\n      For example,
        if the structure is a repeating unit cell with four hydrogens and four oxygens
        that represents two hydroperoxide molecules, `chemical_formula_hill` is `\\\"H2O2\\\"`
        (i.e., not `\\\"HO\\\"`, nor `\\\"H4O4\\\"`).\\n    - If the chemical insight
        needed to ascribe a Hill formula to the system is not present, the property
        MUST be handled as unset.\\n    - Element symbols MUST have proper capitalization
        (e.g., `\\\"Si\\\"`, not `\\\"SI\\\"` for \\\"silicon\\\").\\n    - Elements
        MUST be placed in [Hill order](https://dx.doi.org/10.1021/ja02046a005), followed
        by their integer chemical proportion number.\\n      Hill order means: if
        carbon is present, it is placed first, and if also present, hydrogen is placed
        second.\\n      After that, all other elements are ordered alphabetically.\\n
        \     If carbon is not present, all elements are ordered alphabetically.\\n
        \   - If the system has sites with partial occupation and the total occupations
        of each element do not all sum up to integers, then the Hill formula SHOULD
        be handled as unset.\\n    - No spaces or separators are allowed.\\n\\n- **Examples**:\\n
        \   - `\\\"H2O2\\\"`\\n\\n- **Query examples**:\\n    - A filter that matches
        an exactly given formula is `chemical_formula_hill=\\\"H2O2\\\"`.\",\"type\":\"string\"},\"chemical_formula_reduced\":{\"description\":\"The
        reduced chemical formula for a structure as a string with element symbols
        and integer chemical proportion numbers.\\nThe proportion number MUST be omitted
        if it is 1.\\n\\n- **Type**: string\\n\\n- **Requirements/Conventions**:\\n
        \   - **Support**: SHOULD be supported by all implementations, i.e., SHOULD
        NOT be `null`.\\n    - **Query**: MUST be a queryable property.\\n      However,
        support for filters using partial string matching with this property is OPTIONAL
        (i.e., BEGINS WITH, ENDS WITH, and CONTAINS).\\n      Intricate queries on
        formula components are instead suggested to be formulated using set-type filter
        operators on the multi valued `elements` and `elements_ratios` properties.\\n
        \   - Element symbols MUST have proper capitalization (e.g., `\\\"Si\\\"`,
        not `\\\"SI\\\"` for \\\"silicon\\\").\\n    - Elements MUST be placed in
        alphabetical order, followed by their integer chemical proportion number.\\n
        \   - For structures with no partial occupation, the chemical proportion numbers
        are the smallest integers for which the chemical proportion is exactly correct.\\n
        \   - For structures with partial occupation, the chemical proportion numbers
        are integers that within reasonable approximation indicate the correct chemical
        proportions. The precise details of how to perform the rounding is chosen
        by the API implementation.\\n    - No spaces or separators are allowed.\\n\\n-
        **Examples**:\\n    - `\\\"H2NaO\\\"`\\n    - `\\\"ClNa\\\"`\\n    - `\\\"CCaO3\\\"`\\n\\n-
        **Query examples**:\\n    - A filter that matches an exactly given formula
        is `chemical_formula_reduced=\\\"H2NaO\\\"`.\",\"type\":\"string\"},\"dimension_types\":{\"description\":\"List
        of three integers.\\nFor each of the three directions indicated by the three
        lattice vectors (see property `lattice_vectors`), this list indicates if the
        direction is periodic (value `1`) or non-periodic (value `0`).\\nNote: the
        elements in this list each refer to the direction of the corresponding entry
        in `lattice_vectors` and *not* the Cartesian x, y, z directions.\\n\\n- **Type**:
        list of integers.\\n\\n- **Requirements/Conventions**:\\n    - **Support**:
        SHOULD be supported by all implementations, i.e., SHOULD NOT be `null`.\\n
        \   - **Query**: Support for queries on this property is OPTIONAL.\\n    -
        MUST be a list of length 3.\\n    - Each integer element MUST assume only
        the value 0 or 1.\\n\\n- **Examples**:\\n    - For a molecule: `[0, 0, 0]`\\n
        \   - For a wire along the direction specified by the third lattice vector:
        `[0, 0, 1]`\\n    - For a 2D surface/slab, periodic on the plane defined by
        the first and third lattice vectors: `[1, 0, 1]`\\n    - For a bulk 3D system:
        `[1, 1, 1]`\",\"type\":\"list\"},\"elements\":{\"description\":\"Symbols of
        the different elements present in the structure.\\n\\n- **Type**: list of
        strings.\\n\\n- **Requirements/Conventions**:\\n    - **Support**: SHOULD
        be supported by all implementations, i.e., SHOULD NOT be `null`.\\n    - **Query**:
        MUST be a queryable property with support for all mandatory filter features.\\n
        \   - The strings are the chemical symbols, i.e., either a single uppercase
        letter or an uppercase letter followed by a number of lowercase letters.\\n
        \   - The order MUST be alphabetical.\\n    - MUST refer to the same elements
        in the same order, and therefore be of the same length, as `elements_ratios`,
        if the latter is provided.\\n    - Note: This property SHOULD NOT contain
        the string \\\"X\\\" to indicate non-chemical elements or \\\"vacancy\\\"
        to indicate vacancies (in contrast to the field `chemical_symbols` for the
        `species` property).\\n\\n- **Examples**:\\n    - `[\\\"Si\\\"]`\\n    - `[\\\"Al\\\",\\\"O\\\",\\\"Si\\\"]`\\n\\n-
        **Query examples**:\\n    - A filter that matches all records of structures
        that contain Si, Al **and** O, and possibly other elements: `elements HAS
        ALL \\\"Si\\\", \\\"Al\\\", \\\"O\\\"`.\\n    - To match structures with exactly
        these three elements, use `elements HAS ALL \\\"Si\\\", \\\"Al\\\", \\\"O\\\"
        AND elements LENGTH 3`.\\n    - Note: length queries on this property can
        be equivalently formulated by filtering on the `nelements`_ property directly.\",\"type\":\"list\"},\"elements_ratios\":{\"description\":\"Relative
        proportions of different elements in the structure.\\n\\n- **Type**: list
        of floats\\n\\n- **Requirements/Conventions**:\\n    - **Support**: SHOULD
        be supported by all implementations, i.e., SHOULD NOT be `null`.\\n    - **Query**:
        MUST be a queryable property with support for all mandatory filter features.\\n
        \   - Composed by the proportions of elements in the structure as a list of
        floating point numbers.\\n    - The sum of the numbers MUST be 1.0 (within
        floating point accuracy)\\n    - MUST refer to the same elements in the same
        order, and therefore be of the same length, as `elements`, if the latter is
        provided.\\n\\n- **Examples**:\\n    - `[1.0]`\\n    - `[0.3333333333333333,
        0.2222222222222222, 0.4444444444444444]`\\n\\n- **Query examples**:\\n    -
        Note: Useful filters can be formulated using the set operator syntax for correlated
        values.\\n      However, since the values are floating point values, the use
        of equality comparisons is generally inadvisable.\\n    - OPTIONAL: a filter
        that matches structures where approximately 1/3 of the atoms in the structure
        are the element Al is: `elements:elements_ratios HAS ALL \\\"Al\\\":>0.3333,
        \\\"Al\\\":<0.3334`.\",\"type\":\"list\"},\"id\":{\"description\":\"An entry's
        ID as defined in section Definition of Terms.\\n\\n- **Type**: string.\\n\\n-
        **Requirements/Conventions**:\\n    - **Support**: MUST be supported by all
        implementations, MUST NOT be `null`.\\n    - **Query**: MUST be a queryable
        property with support for all mandatory filter features.\\n    - **Response**:
        REQUIRED in the response.\\n\\n- **Examples**:\\n    - `\\\"db/1234567\\\"`\\n
        \   - `\\\"cod/2000000\\\"`\\n    - `\\\"cod/2000000@1234567\\\"`\\n    -
        `\\\"nomad/L1234567890\\\"`\\n    - `\\\"42\\\"`\",\"type\":\"string\"},\"immutable_id\":{\"description\":\"The
        entry's immutable ID (e.g., an UUID). This is important for databases having
        preferred IDs that point to \\\"the latest version\\\" of a record, but still
        offer access to older variants. This ID maps to the version-specific record,
        in case it changes in the future.\\n\\n- **Type**: string.\\n\\n- **Requirements/Conventions**:\\n
        \   - **Support**: OPTIONAL support in implementations, i.e., MAY be `null`.\\n
        \   - **Query**: MUST be a queryable property with support for all mandatory
        filter features.\\n\\n- **Examples**:\\n    - `\\\"8bd3e750-b477-41a0-9b11-3a799f21b44f\\\"`\\n
        \   - `\\\"fjeiwoj,54;@=%<>#32\\\"` (Strings that are not URL-safe are allowed.)\",\"type\":\"string\"},\"last_modified\":{\"description\":\"Date
        and time representing when the entry was last modified.\\n\\n- **Type**: timestamp.\\n\\n-
        **Requirements/Conventions**:\\n    - **Support**: SHOULD be supported by
        all implementations, i.e., SHOULD NOT be `null`.\\n    - **Query**: MUST be
        a queryable property with support for all mandatory filter features.\\n    -
        **Response**: REQUIRED in the response unless the query parameter `response_fields`
        is present and does not include this property.\\n\\n- **Example**:\\n    -
        As part of JSON response format: `\\\"2007-04-05T14:30:20Z\\\"` (i.e., encoded
        as an [RFC 3339 Internet Date/Time Format](https://tools.ietf.org/html/rfc3339#section-5.6)
        string.)\",\"type\":\"string\"},\"lattice_vectors\":{\"description\":\"The
        three lattice vectors in Cartesian coordinates, in \xE5ngstr\xF6m (\xC5).\\n\\n-
        **Type**: list of list of floats or unknown values.\\n\\n- **Requirements/Conventions**:\\n
        \   - **Support**: SHOULD be supported by all implementations, i.e., SHOULD
        NOT be `null`.\\n    - **Query**: Support for queries on this property is
        OPTIONAL.\\n      If supported, filters MAY support only a subset of comparison
        operators.\\n    - MUST be a list of three vectors *a*, *b*, and *c*, where
        each of the vectors MUST BE a list of the vector's coordinates along the x,
        y, and z Cartesian coordinates.\\n      (Therefore, the first index runs over
        the three lattice vectors and the second index runs over the x, y, z Cartesian
        coordinates).\\n    - For databases that do not define an absolute Cartesian
        system (e.g., only defining the length and angles between vectors), the first
        lattice vector SHOULD be set along *x* and the second on the *xy*-plane.\\n
        \   - MUST always contain three vectors of three coordinates each, independently
        of the elements of property `dimension_types`.\\n      The vectors SHOULD
        by convention be chosen so the determinant of the `lattice_vectors` matrix
        is different from zero.\\n      The vectors in the non-periodic directions
        have no significance beyond fulfilling these requirements.\\n    - The coordinates
        of the lattice vectors of non-periodic dimensions (i.e., those dimensions
        for which `dimension_types` is `0`) MAY be given as a list of all `null` values.\\n
        \       If a lattice vector contains the value `null`, all coordinates of
        that lattice vector MUST be `null`.\\n\\n- **Examples**:\\n    - `[[4.0,0.0,0.0],[0.0,4.0,0.0],[0.0,1.0,4.0]]`
        represents a cell, where the first vector is `(4, 0, 0)`, i.e., a vector aligned
        along the `x` axis of length 4 \xC5; the second vector is `(0, 4, 0)`; and
        the third vector is `(0, 1, 4)`.\",\"type\":\"list\"},\"nelements\":{\"description\":\"Number
        of different elements in the structure as an integer.\\n\\n- **Type**: integer\\n\\n-
        **Requirements/Conventions**:\\n    - **Support**: SHOULD be supported by
        all implementations, i.e., SHOULD NOT be `null`.\\n    - **Query**: MUST be
        a queryable property with support for all mandatory filter features.\\n    -
        MUST be equal to the lengths of the list properties `elements` and `elements_ratios`,
        if they are provided.\\n\\n- **Examples**:\\n    - `3`\\n\\n- **Querying**:\\n
        \   - Note: queries on this property can equivalently be formulated using
        `elements LENGTH`.\\n    - A filter that matches structures that have exactly
        4 elements: `nelements=4`.\\n    - A filter that matches structures that have
        between 2 and 7 elements: `nelements>=2 AND nelements<=7`.\",\"type\":\"integer\"},\"nperiodic_dimensions\":{\"description\":\"An
        integer specifying the number of periodic dimensions in the structure, equivalent
        to the number of non-zero entries in `dimension_types`.\\n\\n- **Type**: integer\\n\\n-
        **Requirements/Conventions**:\\n    - **Support**: SHOULD be supported by
        all implementations, i.e., SHOULD NOT be `null`.\\n    - **Query**: MUST be
        a queryable property with support for all mandatory filter features.\\n    -
        The integer value MUST be between 0 and 3 inclusive and MUST be equal to the
        sum of the items in the `dimension_types` property.\\n    - This property
        only reflects the treatment of the lattice vectors provided for the structure,
        and not any physical interpretation of the dimensionality of its contents.\\n\\n-
        **Examples**:\\n    - `2` should be indicated in cases where `dimension_types`
        is any of `[1, 1, 0]`, `[1, 0, 1]`, `[0, 1, 1]`.\\n\\n- **Query examples**:\\n
        \   - Match only structures with exactly 3 periodic dimensions: `nperiodic_dimensions=3`\\n
        \   - Match all structures with 2 or fewer periodic dimensions: `nperiodic_dimensions<=2`\",\"type\":\"integer\"},\"nsites\":{\"description\":\"An
        integer specifying the length of the `cartesian_site_positions` property.\\n\\n-
        **Type**: integer\\n\\n- **Requirements/Conventions**:\\n    - **Support**:
        SHOULD be supported by all implementations, i.e., SHOULD NOT be `null`.\\n
        \   - **Query**: MUST be a queryable property with support for all mandatory
        filter features.\\n\\n- **Examples**:\\n    - `42`\\n\\n- **Query examples**:\\n
        \   - Match only structures with exactly 4 sites: `nsites=4`\\n    - Match
        structures that have between 2 and 7 sites: `nsites>=2 AND nsites<=7`\",\"type\":\"integer\"},\"species\":{\"description\":\"A
        list describing the species of the sites of this structure.\\nSpecies can
        represent pure chemical elements, virtual-crystal atoms representing a statistical
        occupation of a given site by multiple chemical elements, and/or a location
        to which there are attached atoms, i.e., atoms whose precise location are
        unknown beyond that they are attached to that position (frequently used to
        indicate hydrogen atoms attached to another element, e.g., a carbon with three
        attached hydrogens might represent a methyl group, -CH3).\\n\\n- **Type**:
        list of dictionary with keys:\\n    - `name`: string (REQUIRED)\\n    - `chemical_symbols`:
        list of strings (REQUIRED)\\n    - `concentration`: list of float (REQUIRED)\\n
        \   - `attached`: list of strings (REQUIRED)\\n    - `nattached`: list of
        integers (OPTIONAL)\\n    - `mass`: list of floats (OPTIONAL)\\n    - `original_name`:
        string (OPTIONAL).\\n\\n- **Requirements/Conventions**:\\n    - **Support**:
        SHOULD be supported by all implementations, i.e., SHOULD NOT be `null`.\\n
        \   - **Query**: Support for queries on this property is OPTIONAL.\\n        If
        supported, filters MAY support only a subset of comparison operators.\\n    -
        Each list member MUST be a dictionary with the following keys:\\n        -
        **name**: REQUIRED; gives the name of the species; the **name** value MUST
        be unique in the `species` list;\\n        - **chemical_symbols**: REQUIRED;
        MUST be a list of strings of all chemical elements composing this species.\\n
        \         Each item of the list MUST be one of the following:\\n            -
        a valid chemical-element symbol, or\\n            - the special value `\\\"X\\\"`
        to represent a non-chemical element, or\\n            - the special value
        `\\\"vacancy\\\"` to represent that this site has a non-zero probability of
        having a vacancy (the respective probability is indicated in the `concentration`
        list, see below).\\n\\n          If any one entry in the `species` list has
        a `chemical_symbols` list that is longer than 1 element, the correct flag
        MUST be set in the list `structure_features`.\\n\\n        - **concentration**:
        REQUIRED; MUST be a list of floats, with same length as `chemical_symbols`.\\n
        \         The numbers represent the relative concentration of the corresponding
        chemical symbol in this species.\\n          The numbers SHOULD sum to one.
        Cases in which the numbers do not sum to one typically fall only in the following
        two categories:\\n\\n            - Numerical errors when representing float
        numbers in fixed precision, e.g. for two chemical symbols with concentrations
        `1/3` and `2/3`, the concentration might look something like `[0.33333333333,
        0.66666666666]`. If the client is aware that the sum is not one because of
        numerical precision, it can renormalize the values so that the sum is exactly
        one.\\n            - Experimental errors in the data present in the database.
        In this case, it is the responsibility of the client to decide how to process
        the data.\\n\\n            Note that concentrations are uncorrelated between
        different sites (even of the same species).\\n\\n        - **attached**: OPTIONAL;
        if provided MUST be a list of length 1 or more of strings of chemical symbols
        for the elements attached to this site, or \\\"X\\\" for a non-chemical element.\\n\\n
        \       - **nattached**: OPTIONAL; if provided MUST be a list of length 1
        or more of integers indicating the number of attached atoms of the kind specified
        in the value of the `attached` key.\\n\\n          The implementation MUST
        include either both or none of the `attached` and `nattached` keys, and if
        they are provided, they MUST be of the same length.\\n          Furthermore,
        if they are provided, the `structure_features` property MUST include the string
        `site_attachments`.\\n\\n        - **mass**: OPTIONAL. If present MUST be
        a list of floats, with the same length as `chemical_symbols`, providing element
        masses expressed in a.m.u.\\n          Elements denoting vacancies MUST have
        masses equal to 0.\\n\\n        - **original_name**: OPTIONAL. Can be any
        valid Unicode string, and SHOULD contain (if specified) the name of the species
        that is used internally in the source database.\\n\\n          Note: With
        regards to \\\"source database\\\", we refer to the immediate source being
        queried via the OPTIMADE API implementation.\\n\\n          The main use of
        this field is for source databases that use species names, containing characters
        that are not allowed (see description of the list property `species_at_sites`).\\n\\n
        \   - For systems that have only species formed by a single chemical symbol,
        and that have at most one species per chemical symbol, SHOULD use the chemical
        symbol as species name (e.g., `\\\"Ti\\\"` for titanium, `\\\"O\\\"` for oxygen,
        etc.)\\n      However, note that this is OPTIONAL, and client implementations
        MUST NOT assume that the key corresponds to a chemical symbol, nor assume
        that if the species name is a valid chemical symbol, that it represents a
        species with that chemical symbol.\\n      This means that a species `{\\\"name\\\":
        \\\"C\\\", \\\"chemical_symbols\\\": [\\\"Ti\\\"], \\\"concentration\\\":
        [1.0]}` is valid and represents a titanium species (and *not* a carbon species).\\n
        \   - It is NOT RECOMMENDED that a structure includes species that do not
        have at least one corresponding site.\\n\\n- **Examples**:\\n    - `[ {\\\"name\\\":
        \\\"Ti\\\", \\\"chemical_symbols\\\": [\\\"Ti\\\"], \\\"concentration\\\":
        [1.0]} ]`: any site with this species is occupied by a Ti atom.\\n    - `[
        {\\\"name\\\": \\\"Ti\\\", \\\"chemical_symbols\\\": [\\\"Ti\\\", \\\"vacancy\\\"],
        \\\"concentration\\\": [0.9, 0.1]} ]`: any site with this species is occupied
        by a Ti atom with 90 % probability, and has a vacancy with 10 % probability.\\n
        \   - `[ {\\\"name\\\": \\\"BaCa\\\", \\\"chemical_symbols\\\": [\\\"vacancy\\\",
        \\\"Ba\\\", \\\"Ca\\\"], \\\"concentration\\\": [0.05, 0.45, 0.5], \\\"mass\\\":
        [0.0, 137.327, 40.078]} ]`: any site with this species is occupied by a Ba
        atom with 45 % probability, a Ca atom with 50 % probability, and by a vacancy
        with 5 % probability. The mass of this site is (on average) 88.5 a.m.u.\\n
        \   - `[ {\\\"name\\\": \\\"C12\\\", \\\"chemical_symbols\\\": [\\\"C\\\"],
        \\\"concentration\\\": [1.0], \\\"mass\\\": [12.0]} ]`: any site with this
        species is occupied by a carbon isotope with mass 12.\\n    - `[ {\\\"name\\\":
        \\\"C13\\\", \\\"chemical_symbols\\\": [\\\"C\\\"], \\\"concentration\\\":
        [1.0], \\\"mass\\\": [13.0]} ]`: any site with this species is occupied by
        a carbon isotope with mass 13.\\n    - `[ {\\\"name\\\": \\\"CH3\\\", \\\"chemical_symbols\\\":
        [\\\"C\\\"], \\\"concentration\\\": [1.0], \\\"attached\\\": [\\\"H\\\"],
        \\\"nattached\\\": [3]} ]`: any site with this species is occupied by a methyl
        group, -CH3, which is represented without specifying precise positions of
        the hydrogen atoms.\",\"type\":\"list\"},\"species_at_sites\":{\"description\":\"Name
        of the species at each site (where values for sites are specified with the
        same order of the property `cartesian_site_positions`).\\nThe properties of
        the species are found in the property `species`.\\n\\n- **Type**: list of
        strings.\\n\\n- **Requirements/Conventions**:\\n    - **Support**: SHOULD
        be supported by all implementations, i.e., SHOULD NOT be `null`.\\n    - **Query**:
        Support for queries on this property is OPTIONAL.\\n      If supported, filters
        MAY support only a subset of comparison operators.\\n    - MUST have length
        equal to the number of sites in the structure (first dimension of the list
        property `cartesian_site_positions`).\\n    - Each species name mentioned
        in the `species_at_sites` list MUST be described in the list property `species`
        (i.e. for each value in the `species_at_sites` list there MUST exist exactly
        one dictionary in the `species` list with the `name` attribute equal to the
        corresponding `species_at_sites` value).\\n    - Each site MUST be associated
        only to a single species.\\n      **Note**: However, species can represent
        mixtures of atoms, and multiple species MAY be defined for the same chemical
        element.\\n      This latter case is useful when different atoms of the same
        type need to be grouped or distinguished, for instance in simulation codes
        to assign different initial spin states.\\n\\n- **Examples**:\\n    - `[\\\"Ti\\\",\\\"O2\\\"]`
        indicates that the first site is hosting a species labeled `\\\"Ti\\\"` and
        the second a species labeled `\\\"O2\\\"`.\\n    - `[\\\"Ac\\\", \\\"Ac\\\",
        \\\"Ag\\\", \\\"Ir\\\"]` indicating the first two sites contains the `\\\"Ac\\\"`
        species, while the third and fourth sites contain the `\\\"Ag\\\"` and `\\\"Ir\\\"`
        species, respectively.\",\"type\":\"list\"},\"structure_features\":{\"description\":\"A
        list of strings that flag which special features are used by the structure.\\n\\n-
        **Type**: list of strings\\n\\n- **Requirements/Conventions**:\\n    - **Support**:
        MUST be supported by all implementations, MUST NOT be `null`.\\n    - **Query**:
        MUST be a queryable property.\\n    Filters on the list MUST support all mandatory
        HAS-type queries.\\n    Filter operators for comparisons on the string components
        MUST support equality, support for other comparison operators are OPTIONAL.\\n
        \   - MUST be an empty list if no special features are used.\\n    - MUST
        be sorted alphabetically.\\n    - If a special feature listed below is used,
        the list MUST contain the corresponding string.\\n    - If a special feature
        listed below is not used, the list MUST NOT contain the corresponding string.\\n
        \   - **List of strings used to indicate special structure features**:\\n
        \       - `disorder`: this flag MUST be present if any one entry in the `species`
        list has a `chemical_symbols` list that is longer than 1 element.\\n        -
        `implicit_atoms`: this flag MUST be present if the structure contains atoms
        that are not assigned to sites via the property `species_at_sites` (e.g.,
        because their positions are unknown).\\n           When this flag is present,
        the properties related to the chemical formula will likely not match the type
        and count of atoms represented by the `species_at_sites`, `species` and `assemblies`
        properties.\\n        - `site_attachments`: this flag MUST be present if any
        one entry in the `species` list includes `attached` and `nattached`.\\n        -
        `assemblies`: this flag MUST be present if the property `assemblies` is present.\\n\\n-
        **Examples**: A structure having implicit atoms and using assemblies: `[\\\"assemblies\\\",
        \\\"implicit_atoms\\\"]`\",\"type\":\"list\"},\"type\":{\"description\":\"The
        name of the type of an entry.\\n\\n- **Type**: string.\\n\\n- **Requirements/Conventions**:\\n
        \   - **Support**: MUST be supported by all implementations, MUST NOT be `null`.\\n
        \   - **Query**: MUST be a queryable property with support for all mandatory
        filter features.\\n    - **Response**: REQUIRED in the response.\\n    - MUST
        be an existing entry type.\\n    - The entry of type `<type>` and ID `<id>`
        MUST be returned in response to a request for `/<type>/<id>` under the versioned
        base URL.\\n\\n- **Examples**:\\n    - `\\\"structures\\\"`\",\"type\":\"string\"}}},\"id\":\"structures\",\"links\":{\"base_url\":\"https://www.crystallography.net/cod/optimade/v1.1.0/\"},\"meta\":{\"api_version\":\"1.1.0\",\"data_returned\":1,\"implementation\":{\"issue_tracker\":{\"href\":\"https://projects.ibt.lt/repositories/projects/cod-optimade/issues\"},\"maintainer\":{\"email\":\"cod-bugs@ibt.lt\"},\"name\":\"Crystallography
        Open Database\",\"source_url\":\"svn://www.crystallography.net/cod/tags/v0.14.0/cgi-bin/optimade.pl@304057\",\"version\":\"v0.14.0\"},\"more_data_available\":false,\"provider\":{\"description\":\"Crystallography
        Open Database\",\"name\":\"Crystallography Open Database\",\"prefix\":\"cod\"},\"query\":{\"representation\":\"/info/structures\"},\"schema\":\"https://schemas.optimade.org/openapi/v1.1.0/optimade.json\",\"time_stamp\":\"2026-10-31T20:44:21Z\"},\"type\":\"info\"}\n"
