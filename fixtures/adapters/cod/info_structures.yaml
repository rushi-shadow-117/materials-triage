  response:
    body:
      string: "{\"data\":{\"description\":\"a structures entry\",\"formats\":[\"json\"],\"output_fields_by_format\":{\"json\":[\"_cod_a\",\"_cod_acce_code\",\"_cod_alpha\",\"_cod_authors\",\"_cod_b\",\"_cod_beta\",\"_cod_c\",\"_cod_calcformula\",\"_cod_cellformula\",\"_cod_cellpressure\",\"_cod_celltemp\",\"_cod_chemname\",\"_cod_commonname\",\"_cod_compoundsource\",\"_cod_date\",\"_cod_diffrpressure\",\"_cod_diffrtemp\",\"_cod_doi\",\"_cod_duplicateof\",\"_cod_firstpage\",\"_cod_flags\",\"_cod_gamma\",\"_cod_gofall\",\"_cod_gofgt\",\"_cod_gofobs\",\"_cod_gofref\",\"_cod_issue\",\"_cod_journal\",\"_cod_lastpage\",\"_cod_method\",\"_cod_mineral\",\"_cod_onhold\",\"_cod_optimal\",\"_cod_pressurehist\",\"_cod_radiation\",\"_cod_radsymbol\",\"_cod_radtype\",\"_cod_rall\",\"_cod_rfsqd\",\"_cod_ri\",\"_cod_robs\",\"_cod_rref\",\"_cod_sg\",\"_cod_sghall\",\"_cod_sgnumber\",\"_cod_siga\",\"_cod_sigalpha\",\"_cod_sigb\",\"_cod_sigbeta\",\"_cod_sigc\",\"_cod_sigcellpressure\",\"_cod_sigcelltemp\",\"_cod_sigdiffrpressure\",\"_cod_sigdiffrtemp\",\"_cod_siggamma\",\"_cod_sigvol\",\"_cod_smiles\",\"_cod_status\",\"_cod_svnrevision\",\"_cod_text\",\"_cod_thermalhist\",\"_cod_time\",\"_cod_title\",\"_cod_vol\",\"_cod_volume\",\"_cod_wavelength\",\"_cod_wrall\",\"_cod_wrobs\",\"_cod_wrref\",\"_cod_year\",\"_cod_z\",\"_cod_zprime\",\"assemblies\",\"cartesian_site_positions\",\"chemical_formula_anonymous\",\"chemical_formula_descriptive\",\"chemical_formula_hill\",\"chemical_formula_reduced\",\"dimension_types\",\"elements\",\"elements_ratios\",\"id\",\"immutable_id\",\"last_modified\",\"lattice_vectors\",\"nelements\",\"nperiodic_dimensions\",\"nsites\",\"species\",\"species_at_sites\",\"structure_features\",\"type\"]},\"properties\":{\"_cod_a\":{\"description\":\"The
        lattice parameter a of the crystal structure.\",\"type\":\"float\"},\"_cod_acce_code\":{\"description\":\"Acta
        Crystallographica Coeditor Code. Uniquely identifies a publication by IUCr
        journals and can be used to construct URL of the paper \\\"landing page\\\".\",\"type\":\"string\"},\"_cod_alpha\":{\"description\":\"The
        lattice parameter alpha of the crystal structure.\",\"type\":\"float\"},\"_cod_authors\":{\"description\":\"The
        authors that published the paper describing the crystal structure deposited
        in the COD database, or the authors of the personal communication to COD.
        NB.: The name syntax uses the BibTeX convention, which is slightly different
        from the IUCr convention described under the CIF:DescriptionUrl.\",\"type\":\"string\"},\"_cod_b\":{\"description\":\"The
        lattice parameter b of the crystal structure.\",\"type\":\"float\"},\"_cod_beta\":{\"description\":\"The
        lattice parameter beta of the crystal structure.\",\"type\":\"float\"},\"_cod_c\":{\"description\":\"The
        lattice parameter c of the crystal structure.\",\"type\":\"float\"},\"_cod_calcformula\":{\"description\":\"The
        summary (brutto) formula calculated from the crystal data by the 'cod-tools'
        package. Ideally, should be the same value as in 'formula'.\",\"type\":\"string\"},\"_cod_cellformula\":{\"description\":\"The
        summary (brutto) formula of the whole unit cell calculated from the crystal
        data by the 'cod-tools' package. The number of atoms for each element in the
        'cellformula' is 'Z' times higher than the number of atoms for the same element
