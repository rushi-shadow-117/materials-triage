entered_by: owner
entered_on: '2026-10-31'
captions:
  '1': Table 1 New candidate materials suitable for high-κ dielectrics selected from Figure 3
  '2': Table 2 All high-κ candidate materials for DRAM and CPU from the present property database, which satisfy
    f FOM >210, and E g >3 eV (for DRAM) or E g >4 eV (for CPU)
  '3': Table 3 All high-κ candidate materials for flash memory application from the present property database, which
    satisfy f FOM >80 and E g >6 eV
metric: Spearman rank correlation of the scorer's ranking against the positives, after removing any composition
  that the hazard policy excludes; every negative must be excluded or flagged with its rule shown.
