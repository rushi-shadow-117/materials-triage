discovery:
  # Fully paged MP discovery cassettes for the generality evals (owner addition, Nov 2).
  oxides_gap_3_plus:
    elements: [O]
    nelements: [2, 3]
    band_gap_min: 3.0
    energy_above_hull_max: 0.05
  oxides_gap_2_to_3:
    elements: [O]
    nelements: [2, 3]
    band_gap_min: 2.0
    band_gap_max: 3.0
  nitrides_gap_4_plus:
    elements: [N]
    exclude_elements: [O, F, Cl, Br, I, S, Se, Te, P, As, Sb, H]
    nelements: [2, 3]
    band_gap_min: 4.0
  # Recorded Nov 3 before Track F. These two are no longer the queries the profiles send:
  # since Track F the discovery API gets only hard rules (dielectric: PBE floor 3.0 eV, hull up
  # to 94 meV/atom; photocatalyst: 2.0 to 3.3 eV with the same hull limit), recorded as the
  # run-shaped cassettes fixtures/adapters/mp/run_A1.yaml and run_B1.yaml. Kept as recordings.
  oxides_gap_5_plus:
    elements: [O]
    nelements: [2, 3]
    band_gap_min: 5.0
  oxides_gap_2_to_3_3:
    elements: [O]
    nelements: [2, 3]
    band_gap_min: 2.0
    band_gap_max: 3.3
