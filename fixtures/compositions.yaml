  ZrO2: zirconium dioxide
  SiO2: silicon dioxide
  TiO2: titanium dioxide
  ThO2: thorium dioxide
  La2O3: lanthanum oxide
  BaTiO3: barium titanate
  BeO: beryllium oxide
  Y2O3: yttrium oxide
  Ta2O5: tantalum pentoxide
  WO3: tungsten trioxide
  ZnO: zinc oxide
  Fe2O3: iron(III) oxide
  AlN: aluminum nitride
  GaN: gallium nitride
  Si3N4: silicon nitride
  BN: boron nitride
  CO2: carbon dioxide
  H2O: water
  SO3: sulfur trioxide
  P2O5: phosphorus pentoxide
  P4O9: tetraphosphorus nonaoxide
  B2O3: boron trioxide
  MgO: magnesium oxide
  "Al(PO3)3": aluminum metaphosphate
  "Al2(SO4)3": aluminum sulfate
  Al2SiO5: aluminum silicate
  BaO2: barium peroxide
  Bi2O3: bismuth(III) oxide
  CaO2: calcium peroxide
  CeO2: cerium(IV) oxide
  FeO: iron(II) oxide
  Ga2O3: gallium(III) oxide
