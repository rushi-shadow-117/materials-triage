# Composition set recorded by Track 0 (Nov 2). Groups are kept so evals can address them.
# Formulas are written as the sources print them; adapters normalize with pymatgen.
# Synonyms here are recording probes only; the FDE-owned synonym table is config.
schema_version: 0
groups:
  baseline_oxides: [HfO2, ZrO2, Al2O3, SiO2, TiO2, ThO2, La2O3, BaTiO3, BeO, Y2O3, Ta2O5]
  negatives: [BeO, CdTiO3, Cd2Ta2O7, PbHfO3, PbZrO3]
  photocatalysts: [TiO2, WO3, BiVO4, Fe2O3, ZnO]
  nitrides: [AlN, GaN, Si3N4, BN]
  # Owner request, Nov 3: the top 10 of each recorded discovery query, so discovery runs
  # offline end to end. Names below are PubChem lookup names only.
  discovery_top10_dielectric: [Al2O3, CO2, H2O, SO3, P2O5, P4O9, B2O3, MgO, "Al(PO3)3", "Al2(SO4)3", Al2SiO5]
  discovery_top10_photocatalyst: [BaO, BaO2, Bi2O3, CaO2, CeO2, FeO, Ga2O3, Gd2O3, I2O5, K2O2, NO2, OF2, Re2O7, RuO4, SO2, Sb2O3, SbO2, Se2O5]
  yim_positives:
    source: fixtures/validation/yim2015.yaml
    formulas: [Ag2Ta4O11, AgTaO3, AlLiO2, "AlO(OH)", B2O3, Ba2SiO4, "Ba3(PO4)2", Ba3P4O13, BaSO4,
      BaZrO3, BeO, BiTaO4, CaB4O7, Cd2Ta2O7, CdTiO3, HfO2, HfTe3O8, K2W2O7, KTaO3, LaYO3,
      Li3OBr, Li4CO4, "Mg(OH)2", "Mg4O3(OH)2", MgAl2O4, MgSiO3, Na2SO4, NaIO3, NaNbO3, NaTaO3,
      NbOCl3, PbHfO3, PbZrO3, Sr2Ta2O7, "Sr3(PO4)2", SrB4O7, SrHfO3, SrTiO3, TiO2, "Y2(Si2O7)",
      Y2Ti2O7, YAlO3, YBO3, YOCl, YOF, ZrO2]
hazard_probes:
  # PubChem only. Common names are conventional public names used for the name lookup.
  Tl: thallium
  Tl2SO4: thallium(I) sulfate
  HgO: mercury(II) oxide
  PbO: lead(II) oxide
  BaO: barium oxide
  BaTiO3: barium titanate
