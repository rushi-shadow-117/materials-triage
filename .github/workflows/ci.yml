name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Create database roles
        run: psql "postgresql://triage:triage@localhost:5433/triage" -v ON_ERROR_STOP=1 -f src/materials_triage/provenance/roles.sql
      - name: Migrate as the migration role
        run: uv run alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app (the browser tests serve it)
        run: npm ci && npm run build
        working-directory: web
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Generated types match the committed OpenAPI export
        run: |
          npx openapi-typescript src/api/openapi.json -o /tmp/types.ts
          diff -q /tmp/types.ts src/api/types.ts
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Both Compose files resolve; site services on the internal network publish no port
        run: |
          docker compose --profile auth --profile split-web -f compose.yaml config -q
          docker compose --profile auth --profile split-web -f compose.yaml -f compose.site.yaml \
            config --format json | python3 -c '
          import json, sys
          s = json.load(sys.stdin)["services"]
          for name in ("postgres", "keycloak"):
              assert sorted(s[name]["networks"]) == ["internal"], name
              assert not s[name].get("ports"), name
          '
      - name: Build the api image (no push)
        run: docker build --target api -t materials-triage:api .
      - name: The image serves /api/health from the recorded data with no keys
        run: |
          docker run -d --rm --name triage -p 8000:8000 materials-triage:api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"fetch_source":"cassettes"'
          docker stop triage

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
