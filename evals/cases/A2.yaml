id: A2
group: A
kind: normal
title: Same request, PI already has a list
request: 'Rank these for me as thin-film dielectrics: HfO2, ZrO2, Y2O3, La2O3, TiO2, Ta2O5, MgO, ThO2.'
expectation: candidate-list mode, no discovery query; same criteria; ThO2 excluded and shown why;
