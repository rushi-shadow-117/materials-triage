[project]
name = "materials-triage"
version = "0.0.1"
description = "Triage candidate materials from public sources before experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "authlib>=1.3",
    "emmet-core>=0.84",
    "fastapi>=0.115",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "vcrpy>=6",
    "python-dotenv>=1.0",
    "mp-api>=0.45",
    "pytest-asyncio>=0.23",
    "playwright>=1.45",
    "types-pyyaml>=6.0",
]

[project.scripts]
materials-triage = "materials_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/materials_triage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["vcr", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
