# The split-front deployment: nginx serves the built web app and proxies /api to the API
# service on the Compose network. The api image also serves the app on its own, so this
# service is optional (see docs/ADMIN_GUIDE.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;          # server-sent events pass through as they arrive
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;   # client-side routes load the app
    }
}
