services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:5433:5432"  # 5433 on the host: many machines already run Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the three roles on first start. For an existing volume run:
      #   docker compose exec -T postgres psql -U triage -d triage < src/materials_triage/provenance/roles.sql
      - ./src/materials_triage/provenance/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API, which also serves the built web app. Reads .env (keys, auth mode, model,
  # classify mode). With FETCH_MODE=replay and no keys it runs from the recorded data in the
  # image. The host allowlist is enforced in code (adapters/egress.py); compose.site.yaml adds
  # the network split for site deployments.
  api:
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://triage_app:triage_app@postgres:5432/triage
      DATA_CACHE_DIR: /app/.data-cache
    ports:
      - "8000:8000"
    volumes:
      - datacache:/app/.data-cache
    depends_on:
      postgres:
        condition: service_healthy

  # Optional split front: nginx serves web/dist and proxies /api to the api service. Use it
  # when the static app and the API are deployed separately; otherwise the api service alone
  # serves both at :8000. Start with `docker compose --profile split-web up -d`.
  web:
    build:
      context: .
      target: web-nginx
    profiles: ["split-web"]
    ports:
      - "8081:80"
    depends_on: [api]

  # Dev identity provider, started only with `docker compose --profile auth up -d keycloak`.
  # Imports deploy/keycloak/realm-materials-triage.json: roles scientist, fde, admin; users
  # with the same names and passwords (dev only); a public PKCE client for the web app whose
  # access tokens carry the audience materials-triage-api. The API then runs with
  # AUTH_MODE=oidc OIDC_ISSUER=http://localhost:8080/realms/materials-triage
  # OIDC_AUDIENCE=materials-triage-api.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"  # the browser reaches the login page here
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

# Development: one default network, and Postgres and Keycloak publish on 127.0.0.1 only. A site
# deployment adds compose.site.yaml, which moves them to an internal network. Docker publishes
# no host port for a service whose only network is internal, so that split is site-only.

volumes:
  pgdata:
  datacache:
