# Element-level hazard policy, owned by the site admin. Tiers by hazard type and authority.
# Status vocabulary is in config/README.md. The loader (Phase 2) applies only `entered` rules.
schema_version: 0

tiers:
  exclude:
    description: "Candidates containing these elements are excluded; the exclusion rule is shown."
    entries:
      - element: As
        reason: "IARC Group 1: arsenic and inorganic arsenic compounds"
        status: entered
        source:
          citation: "IARC Monographs Volume 100C, Arsenic, Metals, Fibres, and Dusts (2012)"
          url: https://publications.iarc.who.int/120
          access: open
        entered_by: owner
        entered_on: 2026-10-31
      - element: Be
        reason: "IARC Group 1: beryllium and beryllium compounds"
        status: entered
        source:
          citation: "IARC Monographs Volume 100C (2012)"
          url: https://publications.iarc.who.int/120
          access: open
        entered_by: owner
        entered_on: 2026-10-31
      - element: Cd
        reason: "IARC Group 1: cadmium and cadmium compounds"
        status: entered
        source:
          citation: "IARC Monographs Volume 100C (2012)"
          url: https://publications.iarc.who.int/120
          access: open
        entered_by: owner
        entered_on: 2026-10-31
      - element: Ni
        reason: "IARC Group 1: nickel compounds, evaluated as a group"
        status: entered
        approval: "Owner approved 2026-10-31."
        admin_may_downgrade_to: flag
        note: "IARC states that some group evaluations apply to the group of compounds as a whole and not necessarily to every individual compound. Default is exclude; a site admin may downgrade to flag."
        source:
          citation: "IARC Monographs Volume 100C (2012)"
          url: https://publications.iarc.who.int/120
          access: open
        entered_by: owner
        entered_on: 2026-10-31

  flag:
    description: "Candidates stay ranked; the row carries the flag text."
    entries:
      - element: Cr
        reason: "IARC Group 1 applies to chromium(VI) compounds only; Cr2O3 is chromium(III). Flag text names the oxidation state present."
        flag_text: "Contains chromium. IARC Group 1 applies to Cr(VI) compounds; verify the oxidation state in the candidate phase."
        status: entered
        source:
          citation: "IARC Monographs Volume 100C (2012)"
          url: https://publications.iarc.who.int/120
          access: open
        entered_by: owner
        entered_on: 2026-10-31

  radioactive_exclude:
    description: "Elements with no stable isotope. Admin-locked, default on."
    status: entered
    elements: [Tc, Pm, Po, At, Rn, Fr, Ra, Ac, Th, Pa, U, Np, Pu, Am, Cm, Bk, Cf, Es, Fm, Md, "No", Lr, Rf, Db, Sg, Bh, Hs, Mt, Ds, Rg, Cn, Nh, Fl, Mc, Lv, Ts, Og]
    rule: "Elements with no stable isotope: Tc, Pm, and Z >= 84."
    documented_exception: "Bi (Z = 83) has no stable isotope in the strict sense (Bi-209 alpha-decays with a half-life of about 2e19 years) but is treated as stable here because that half-life is far beyond practical relevance. Owner decision 2026-10-31."
    source:
      citation: "NNDC NuDat 3, National Nuclear Data Center, Brookhaven National Laboratory (ground-state half-lives per nuclide)"
      url: https://www.nndc.bnl.gov/nudat3/
      access: open
      url_checked: 2026-10-31
    additional_sources:
      - element: Th
        citation: "IARC Group 1: thorium-232 and its decay products (as colloidal thorium dioxide), IARC Monographs Volume 78 (2001), carried into Volume 100D (2012)"
        url: https://publications.iarc.who.int/121
        access: open
        status: entered
    entered_by: owner
    entered_on: 2026-10-31

  acute_toxicity:
    description: "Compound-level rule from PubChem GHS hazard statements, plus element-level entries where a representative compound meets the exclude set."
    rule:
      exclude_if_any: [H300, H310, H330, H360]
      flag_if_any: [H301, H302, H311, H312, H331, H332]
      note: "H300/H310/H330 are GHS acute toxicity category 1-2 statements (oral, dermal, inhalation); H360 is reproductive toxicity category 1, included in the exclude set by the owner. H301/H302, H311/H312, H331/H332 are acute toxicity categories 3-4. A compound with any hazard code in any notification is never shown as unclassified; no notifications at all is 'unknown' and lands in the flag tier."
    status: entered
    approval: "Owner confirmed the probe tiers 2026-10-31."
    source:
      citation: "United Nations, Globally Harmonized System of Classification and Labelling of Chemicals (GHS), Rev. 10 (2023), Annex 3, hazard statement codes"
      url: https://unece.org/transport/dangerous-goods/ghs-rev10-2023
      access: open
      url_checked: "unece.org returned HTTP 403 to automated checks on 2026-10-31; URL not confirmed by tool"
    compound_tiers:
      - composition: HgO
        cid: 30856
        tier: exclude
        codes_matched: [H300, H310, H330, H360]
        status: entered
        source: {citation: "PubChem CID 30856, GHS Classification section, recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/30856", access: open}
        entered_by: owner
        entered_on: 2026-10-31
      - composition: PbO
        cid: 14827
        tier: exclude
        codes_matched: [H360]
        status: entered
        source: {citation: "PubChem CID 14827, GHS Classification section, recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/14827", access: open}
        entered_by: owner
        entered_on: 2026-10-31
      - composition: BaO
        cid: 62392
        tier: flag
        codes_matched: [H301, H302, H332]
        status: entered
        source: {citation: "PubChem CID 62392, GHS Classification section, recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/62392", access: open}
        entered_by: owner
        entered_on: 2026-10-31
      - composition: BaTiO3
        cid: 159419
        tier: unknown
        codes_matched: []
        status: entered
        note: "No GHS notifications in PubChem. The element-level barium flag below still applies, so the row ends up flagged."
        source: {citation: "PubChem CID 159419, GHS Classification section ('Not Classified'), recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/159419", access: open}
        entered_by: owner
        entered_on: 2026-10-31
    element_tiers:
      - element: Tl
        tier: exclude
        reason: "Representative thallium compounds meet the exclude set: thallium metal (CID 5359464) carries H300, H310, H330; thallium(I) sulfate (CID 24833) carries H300. Tl2O3 itself has no PubChem GHS data."
        status: entered
        source: {citation: "PubChem CIDs 5359464 and 24833, GHS Classification sections, recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/5359464", access: open}
        entered_by: owner
        entered_on: 2026-10-31
      - element: Ba
        tier: flag
        reason: "Soluble barium compounds carry acute toxicity codes (BaO: H301, H302, H332); insoluble barium compounds such as BaTiO3 have no GHS data. Flag, not exclude."
        status: entered
        source: {citation: "PubChem CID 62392 (BaO), GHS Classification section, recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/62392", access: open}
        entered_by: owner
        entered_on: 2026-10-31
      - element: Hg
        tier: exclude
        reason: "HgO (CID 30856) meets the exclude set."
        status: entered
        source: {citation: "PubChem CID 30856, recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/30856", access: open}
        entered_by: owner
        entered_on: 2026-10-31
      - element: Pb
        tier: exclude
        reason: "PbO (CID 14827) meets the exclude set (H360)."
        status: entered
        source: {citation: "PubChem CID 14827, recorded 2026-10-31", url: "https://pubchem.ncbi.nlm.nih.gov/compound/14827", access: open}
        entered_by: owner
        entered_on: 2026-10-31
    probe_recordings:
      recorded_on: 2026-10-31
      cassettes: fixtures/wire/pubchem/{HgO,Tl2O3,PbO,BaO,BaTiO3,Tl,Tl2SO4}.yaml
    entered_by: owner
    entered_on: 2026-10-31

  process_hazard:
    description: "Keep the candidate and attach a caveat. Triggered by GHS particulate codes on the compound or by a per-material classification below."
    caveat_template:
      status: entered
      text: "Particulate hazard during processing: powders, sputter targets, and chamber residues may present inhalation hazards that the deposited film does not. {material_specific_classification} Follow site EHS procedures."
      source:
        citation: "Owner-drafted caveat text, 2026-10-31"
        url: null
        access: not_applicable
      entered_by: owner
      entered_on: 2026-10-31
    material_classifications:
      - composition: SiO2
        text: "Crystalline silica inhaled as quartz or cristobalite from occupational sources is IARC Group 1. The classification applies to crystalline forms; device SiO2 films are typically amorphous, and the hazard is in powders and particulates."
        status: entered
        source:
          citation: "IARC Monographs Volume 100C, Silica dust, crystalline, in the form of quartz or cristobalite (2012)"
          url: https://publications.iarc.who.int/120
          access: open
        entered_by: owner
        entered_on: 2026-10-31
      - composition: TiO2
        text: "Titanium dioxide is IARC Group 2B (possibly carcinogenic to humans), based on animal inhalation studies of respirable particles. The EU Court of Justice on 1 August 2025 upheld the annulment of its EU classification as a carcinogen by inhalation."
        status: entered
        source:
          citation: "IARC Monographs Volume 93, Carbon Black, Titanium Dioxide, and Talc (2010)"
          url: https://publications.iarc.who.int/111
          access: open
        additional_sources:
          - citation: "Court of Justice of the European Union, press release No 99/25, 1 August 2025, Joined Cases C-71/23 P and C-82/23 P"
            url: https://curia.europa.eu/jcms/upload/docs/application/pdf/2025-08/cp250099en.pdf
            access: open
          - citation: "NIOSH Current Intelligence Bulletin 63: Occupational Exposure to Titanium Dioxide, DHHS (NIOSH) Publication 2011-160"
            url: https://www.cdc.gov/niosh/docs/2011-160/
            access: open
            status: entered
          - citation: "AIHA news summary, 21 August 2025: European court upholds ruling on classification of titanium dioxide"
            url: https://www.aiha.org/news/250821-european-court-upholds-ruling-on-classification-of-titanium-dioxide
            access: open
            status: entered
        entered_by: owner
        entered_on: 2026-10-31

  ghs_flag_codes:
    description: "GHS codes outside the acute exclude and flag sets that keep the candidate ranked at the neutral score with the flag shown. Admin-configurable."
    codes: [H340, H341, H350, H351, H361, H370]
    note: "H340/H341 germ cell mutagenicity, H350/H351 carcinogenicity, H361 reproductive toxicity category 2, H370 specific target organ toxicity single exposure category 1. Code meanings cite the UN GHS."
    caveat_template:
      text: "Flagged: a suspected carcinogenic, mutagenic, reproductive, or single-exposure organ-toxicity classification (GHS {codes}) appears in {M} of {N} reports. Check the form and handling requirements with site EHS."
      placeholders: "{codes}: the record's codes in this flag set; {M}: reports carrying a classification; {N}: reports in total. Filled by code from the PubChem record; a missing count renders as an unreported number, never 0."
      status: entered
      source:
        citation: "UN GHS hazard statement definitions (H340, H341, H350, H351, H361, H370); owner decision 2026-11-04. The sentence restates what the codes mean and adds no chemistry claim."
        url: https://unece.org/transport/dangerous-goods/ghs-rev10-2023
        access: open
      entered_by: owner
      entered_on: 2026-11-04
    status: entered
    source:
      citation: "Owner policy decision 2026-11-02, taken on seeing the Al2O3 result before pre-registration; code meanings from United Nations, GHS Rev. 10 (2023), Annex 3"
      url: https://unece.org/transport/dangerous-goods/ghs-rev10-2023
      access: open
    entered_by: owner
    entered_on: 2026-11-02

  ghs_other_codes_rule:
    description: "Every GHS code outside the exclude sets and the flag sets (for example H315, H319, H335, H372, H373) becomes a process-hazard caveat; the candidate keeps the allow score of 1.0 and the codes are shown as M of N reports."
    status: entered
    source:
      citation: "Owner policy decision 2026-11-02: these codes describe respirable powder handling, not film hazards. Taken on seeing the Al2O3 result before pre-registration."
      url: null
      access: not_applicable
    entered_by: owner
    entered_on: 2026-11-02

unknown_hazard_rule:
  description: "A compound with no PubChem record, or an element with no tier entry, lands in the flag tier with a neutral score and a caveat. Never shown as safe."
  status: entered
  source:
    citation: "docs/DECISIONS.md, 2026-10-31, unknown-hazard rule (design decision, not a chemistry fact)"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-10-31

ghs_display_rule:
  description: "PubChem GHS aggregates are shown as 'hazard codes in M of N reports' (PubChem's word: reports by companies, owner decision 2026-11-05) and never collapsed to a majority verdict."
  status: entered
  entered_by: owner
  entered_on: 2026-10-31
