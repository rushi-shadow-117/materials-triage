# Default site profile, owned by the site admin. Status vocabulary in config/README.md.
schema_version: 0

deposition_methods:
  status: entered
  preferred: null
  methods: [ALD, PEALD, sputtering, PLD, CVD, MOCVD, evaporation, sol_gel, MBE]
  note: "Routes for oxide thin films available at a typical site; no method preferred until the site configures its equipment. The source page returned HTTP 403 to automated checks on 2026-10-31; the list is the owner's reading plus the owner's additions of 2026-11-02."
  source:
    citation: "Advances in Condensed Matter Physics 2018, article 7598978 (ALD Al2O3 films; lists deposition routes), plus owner decision 2026-11-02"
    doi: 10.1155/2018/7598978
    url: https://doi.org/10.1155/2018/7598978
    access: open
  entered_by: owner
  entered_on: 2026-11-02

screen_cannot_tell_you:
  description: "Properties always shown as missing; the screen does not estimate them."
  status: entered
  items:
    - breakdown field
    - leakage current density
    - band offsets to the substrate
    - interface trap and defect density
    - crystallization temperature
    - interfacial reaction with the substrate
    - the film's actual phase and density
  rationale: "Owner's reading of Robertson (2004): early high-k oxides had inferior electronic properties to SiO2, such as a tendency to crystallise and high electronic defect concentrations. None of these are in the data sources used here."
  source:
    citation: "Owner decision 2026-10-31, informed by J. Robertson, Eur. Phys. J. Appl. Phys. 28, 265-291 (2004)"
    url: https://doi.org/10.1051/epjap:2004206
    access: unknown
  entered_by: owner
  entered_on: 2026-10-31

