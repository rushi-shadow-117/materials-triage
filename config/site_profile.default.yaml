# Default site profile, owned by the site admin. Status vocabulary in config/README.md.
schema_version: 0

deposition_methods:
  status: entered
  preferred: null
  methods: [ALD, PEALD, sputtering, PLD, CVD, MOCVD, evaporation, sol_gel, MBE]
  note: "Routes for oxide thin films available at a typical site; no method preferred until the site configures its equipment. The source page returned HTTP 403 to automated checks on 2026-10-31; the list is the owner's reading plus the owner's additions of 2026-11-02."
  source:
    citation: "Advances in Condensed Matter Physics 2018, article 7598978 (ALD Al2O3 films; lists deposition routes), plus owner decision 2026-11-02"
    doi: 10.1155/2018/7598978
    url: https://doi.org/10.1155/2018/7598978
    access: open
  entered_by: owner
  entered_on: 2026-11-02

screen_cannot_tell_you:
  description: "Properties always shown as missing; the screen does not estimate them."
  status: entered
  items:
    - breakdown field
    - leakage current density
    - band offsets to the substrate
    - interface trap and defect density
    - crystallization temperature
    - interfacial reaction with the substrate
    - the film's actual phase and density
  rationale: "Owner's reading of Robertson (2004): early high-k oxides had inferior electronic properties to SiO2, such as a tendency to crystallise and high electronic defect concentrations. None of these are in the data sources used here."
  source:
    citation: "Owner decision 2026-10-31, informed by J. Robertson, Eur. Phys. J. Appl. Phys. 28, 265-291 (2004)"
    url: https://doi.org/10.1051/epjap:2004206
    access: unknown
  entered_by: owner
  entered_on: 2026-10-31

glossary:
  status: entered
  description: "Display terms for terminology=general; technical views are unchanged."
  terms:
    energy above hull: stability margin
    band gap: insulating gap
    polymorph: crystal form
    hull: stability reference
  source:
    citation: "Owner decision 2026-11-03; plain-language display terms, not definitions"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-11-03

attribution:
  echa:
    status: entered
    text: "Source: European Chemicals Agency, https://echa.europa.eu/"
    rule: "Shown on every row whose PubChem GHS record lists ECHA among its references."
    source:
      citation: "European Chemicals Agency, Legal notice (reuse of information requires the source to be acknowledged)"
      url: https://echa.europa.eu/legal-notice
      access: open
    entered_by: owner
    entered_on: 2026-11-02

stability_cutoff_bounds:
  status: entered
  description: "A scientist may set the energy above hull cutoff for a run in these bounds; requests outside are clamped and shown. The maximum is also the hull prefilter of the discovery query."
  min_mev_per_atom: 0
  max_mev_per_atom: 94
  source:
    citation: "Site admin default, owner decision 2026-11-03; the maximum equals the profile cutoff from Sun et al. 2016"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-11-03

weight_bounds:
  status: entered
  description: "Scientists may set any weight in these bounds; requests outside are clamped and shown."
  bounds:
    stability: {min: 0.0, max: 1.0}
    band_gap: {min: 0.0, max: 1.0}
    hazard: {min: 0.1, max: 1.0}
    simplicity: {min: 0.0, max: 1.0}
    evidence: {min: 0.0, max: 1.0}
    dielectric_constant: {min: 0.0, max: 1.0}
    deposition_method: {min: 0.0, max: 1.0}
    cost: {min: 0.0, max: 1.0}
  source:
    citation: "Site admin default, owner decision 2026-11-02; hazard minimum 0.1 is an owner decision of 2026-11-03 so the hazard criterion can never be weighted out of a ranking"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-11-02

physical_ranges:
  status: entered
  description: "Physical ranges for the band gap filters and the element count a run may request. Requests outside are clamped and shown, like the weight and stability clamps."
  band_gap_ev:
    min: 0
    max: 15
  max_elements:
    min: 1
    max: 6
  source:
    citation: "Owner decision 2026-11-05 (review fix batch, item 5); a site setting, not a chemistry claim"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-11-05

defaults:
  status: entered
  top_n_max: 50
  default_view: pi_summary
  default_verbosity: standard
  default_terminology: technical
  radioactive_exclusion_locked: true
  source:
