# FDE-owned scoring profile for the "gate dielectric on silicon" use case.
# Thresholds are owner-sourced or owner-decided; status vocabulary in config/README.md.
schema_version: 0
profile: gate_dielectric_on_si
description: "Oxide dielectric candidates for thin-film experiments on silicon."

criteria:
  stability:
    kind: energy_above_hull_ev_per_atom
    shape: "soft ramp from 0 to the cutoff, hard exclusion above the cutoff"
    cutoff_ev_per_atom: null
    status: open
    evidence:
      - statement: "Across all known inorganic crystalline materials in the Materials Project, the DFT-calculated median metastability is 15 +/- 0.5 meV/atom and the 90th percentile is 67 +/- 2 meV/atom. The 90th percentile varies by chemistry (Fig. 1C); the oxide-specific value is read from that figure, not from the text."
        source:
          citation: "W. Sun et al., The thermodynamic scale of inorganic crystalline metastability, Sci. Adv. 2, e1600225 (2016), CC BY-NC 4.0"
          url: https://europepmc.org/article/PMC/PMC5262468
          access: open
      - statement: "Formation energies from adjacent stable compounds in phase space can be calculated to within 24 meV/atom."
        source:
          citation: "Same paper, citing its reference 29"
          url: https://europepmc.org/article/PMC/PMC5262468
          access: open
    note: "Owner to read the oxide-specific 90th percentile from Fig. 1C and set cutoff_ev_per_atom; the overall 67 meV/atom is the documented fallback candidate pending that reading."
    entered_by: owner
    entered_on: 2026-10-31

  band_gap:
    kind: band_gap_ev
    policy: best_available
    source_order: [experimental, tbmbj, pbe]
    soft_preference_start_ev: 5.0
    status: pending_verification
    rationale: "Owner's reading of Robertson (2004): oxides on Si need band offsets above about 1 eV for both carriers; Ta2O5 and SrTiO3 have small or vanishing conduction band offsets while La2O3, Y2O3, Gd2O3, ZrO2, HfO2, Al2O3 and silicates exceed 1.4 eV for both. Gap alone cannot guarantee offsets, so the gap is a soft preference and the standing caveat applies."
    standing_caveat: "Band offsets to the substrate are not checked by this screen."
    source:
      citation: "J. Robertson, Eur. Phys. J. Appl. Phys. 28, 265-291 (2004)"
      doi: 10.1051/epjap:2004206
      url: https://doi.org/10.1051/epjap:2004206
      access: unknown
    note: "Primary article not fetchable by tools (HTTP 403, 2026-10-31); owner to verify the offset statements. The 5 eV start is the owner's recommendation, application-dependent."
    aggregate_when_several_experimental_values: median
    aggregate_options: [median, minimum]
    conflict_tolerance_ev: null
    conflict_tolerance_status: open
    conflict_tolerance_derivation: "Set in Phase 2 to twice the measured TBmBJ-vs-experimental error on the oxide subset; derivation recorded here when done."
    on_conflict: next_source
    on_conflict_options: [next_source, minimum]
    entered_by: owner
    entered_on: 2026-10-31

  dielectric_constant:
    kind: static_dielectric_constant
    weight: 0.0
    target_band: [10, 30]
    shape: "target band, not higher-is-better"
    status: pending_verification
    rationale: "Owner's reading of a secondary summary of Robertson (2004): k above 10, preferably 25 to 30; very high k is undesirable in CMOS because of fringing fields at source and drain."
    source:
      citation: "J. Robertson, Eur. Phys. J. Appl. Phys. 28, 265-291 (2004)"
      doi: 10.1051/epjap:2004206
      url: https://doi.org/10.1051/epjap:2004206
      access: unknown
    note: "Confirm against the primary review before use."
    entered_by: owner
    entered_on: 2026-10-31

  simplicity:
    max_elements: 3
    anion_policy: strict_oxide
    ternary_penalty: true
    ternary_penalty_size: null
    status: entered
    source:
      citation: "PI preference, not a chemistry fact; listed as a discovery question (owner decision 2026-10-31)"
      url: null
      access: not_applicable
    entered_by: owner
    entered_on: 2026-10-31

  hazard:
    policy_file: config/hazard_policy.yaml
    status: entered
    entered_by: owner
    entered_on: 2026-10-31

  evidence:
    status: open
    note: "Evidence tiers are defined in the Phase 2 round."
    entered_by: owner
    entered_on: 2026-10-31

anchors:
  status: entered
  compositions: [SiO2]
  rule: "Anchors are never ranked; the scorer reports a would-rank position. HfO2 is not anchored because it is an expected ranked result. A site may add its own incumbent."
  source:
    citation: "Owner decision 2026-10-31"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-10-31
