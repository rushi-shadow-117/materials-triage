# FDE-owned scoring profile: wide-gap nitride candidates (test query B2, owner decision 2026-11-03).
# Same machinery as oxide_dielectric_thin_film; anion policy, gap rule, and discovery floor differ.
# Thresholds are owner-sourced or owner-decided; status vocabulary in config/README.md.
schema_version: 0
profile: nitride_wide_gap
description: "Wide-gap nitride candidates: nitrogen the only anion, band gap at least 4.0 eV."

criteria:
  stability:
    kind: energy_above_hull_ev_per_atom
    hull: mixed_GGA_GGA+U_R2SCAN
    shape: "linear ramp: score 1 at 0 meV/atom, 0 at cutoff; hard exclusion above cutoff"
    cutoff_mev_per_atom: 94
    near_cutoff_band_mev_per_atom: 24
    near_cutoff_flag: "near cutoff"
    thermo_enrichment: "fetch per-functional thermo documents for polymorphs within the near-cutoff band and flag hull-status disagreement"
    status: entered
    source:
      citation: "W. Sun et al., The thermodynamic scale of inorganic crystalline metastability, Sci. Adv. 2, e1600225 (2016), CC BY-NC 4.0"
      url: https://europepmc.org/article/PMC/PMC5262468
      access: open
      quote: "the 90th percentile for binary oxides occurring at 94 meV/atom"
      quote_2: "formation energies from adjacent stable compounds in phase space can be accurately calculated to within 24 meV/atom"
    caveat: "The 94 meV/atom percentile was computed on Materials Project GGA/GGA+U (PBE) energies for ICSD-observed binary oxide polymorphs. It is applied here to MP's mixed GGA_GGA+U_R2SCAN hull, which did not exist when the paper was written. Known limitation; shown in the audit view."
    anion_calibration_caveat: "The 94 meV/atom stability cutoff is the 90th percentile of metastability for ICSD-observed binary oxides (Sun et al. 2016). This run's anion policy is not strict oxide, so the cutoff is applied outside the chemistry it was calibrated on."
    anion_calibration_note: "Emitted by code on every row whenever simplicity.anion_policy is not strict_oxide (owner decision 2026-11-03, test query B2). TODO (owner): source the per-chemistry metastability statement for nitrides from Sun et al. 2016 before extending this text."
    note: "Both numbers configurable. The all-chemistries 90th percentile (67 +/- 2 meV/atom) and median (15 +/- 0.5) are in the same paper."
    entered_by: owner
    entered_on: 2026-10-31

  band_gap:
    kind: band_gap_ev
    policy: best_available
    source_order: [experimental, tbmbj, pbe]
    soft_preference_start_ev: null
    hard_min_ev: 4.0
    hard_max_ev: null
    discovery_prefilter:
      pbe_floor_ev: 2.4
      description: "PBE band gap floor sent to the Materials Project discovery query: the 4.0 eV hard minimum adjusted by the same 40% PBE underestimate as the dielectric profile."
      derivation: "4.0 eV x (1 - 0.40)"
      status: entered
      source:
        citation: "Materials Project documentation, Electronic Structure methodology page; owner decision 2026-11-03"
        url: https://docs.materialsproject.org/methodology/materials-methodology/electronic-structure
        access: open
        quote: "typically, we find that band gaps are underestimated by about 40%"
        checked_on: 2026-11-03
      entered_by: owner
      entered_on: 2026-11-03
    shape: "hard minimum: excluded below hard_min_ev on the policy's chosen gap; 1.0 at or above it"
    status: entered
    source:
      citation: "Owner decision 2026-11-03 (Track F item 9): hard_min_ev 4.0 for the nitride profile; an application choice, not a sourced chemistry fact"
      url: null
      access: not_applicable
    pbe_only_caveat: "Only a computed PBE gap is available; PBE typically underestimates gaps (Materials Project documentation)."
    pbe_only_caveat_source:
      citation: "Materials Project documentation, Electronic Structure methodology page; caveat text owner decision 2026-11-04 (human test session fix batch, item 5)"
      url: https://docs.materialsproject.org/methodology/materials-methodology/electronic-structure
      access: open
    aggregate_when_several_experimental_values: median
    experimental_forms:
      preferred: [crystalline_bulk, compendium, thin_film, amorphous_film]
      description: "Experimental gaps are never averaged across material forms. The first form in this list with a point value is used and the median is taken within it; values in other forms are shown in the audit view and the drill-down, not used. compendium is the experimental gap table, whose form is not recorded."
      status: entered
      source:
        citation: "Owner decision 2026-11-04 (human test session fix batch, item 4): non-thin-film profiles prefer crystalline values; compendium after them"
        access: not_applicable
      entered_by: owner
      entered_on: 2026-11-04
    aggregate_options: [median, minimum]
    conflict_tolerance_ev: null
    conflict_tolerance_status: open
    conflict_tolerance_note: "The 1.345 eV tolerance was derived on the baseline oxides; none is derived for nitrides, so experimental and TBmBJ gaps are shown side by side and not compared."
    on_conflict: next_source
    on_conflict_options: [next_source, minimum]
    entered_by: owner
    entered_on: 2026-10-31

  dielectric_constant:
    kind: static_dielectric_constant
    weight: 0.0
    target_band: null
    status: open
    note: "No target band for this profile; the criterion stays at weight 0."
    entered_by: owner
    entered_on: 2026-11-03

  simplicity:
    max_elements: 3
    anion_policy: strict_nitride
    ternary_penalty: true
    ternary_penalty_size: null
    status: entered
    source:
      citation: "PI preference, not a chemistry fact; listed as a discovery question (owner decision 2026-10-31)"
      url: null
      access: not_applicable
    entered_by: owner
    entered_on: 2026-10-31

  structure:
    kind: structural_dimensionality
    exclude_dimensionality: [0]
    rule: "structure.molecular: the scored polymorph's structural dimensionality (Larsen method on CrystalNN bonds, pymatgen get_dimensionality_larsen) is 0, so the crystal is built from isolated molecules or clusters, not an extended solid; excluded from thin-film candidates. Computed only for enriched rows (the scored polymorph's MP structure); missing never excludes."
    method: "pymatgen.analysis.dimensionality.get_dimensionality_larsen on CrystalNN().get_bonded_structure (the bonding route pymatgen's docstring gives)"
    status: entered
    source:
      citation: "P. M. Larsen, M. Pandey, M. Strange, K. W. Jacobsen, Definition of a scoring parameter to identify low-dimensional materials components, Phys. Rev. Materials 3, 034003 (2019); owner confirmed 2026-11-04 (Track G item 1; the npj Comput Mater reference in the first instruction was a mistake)"
      url: https://doi.org/10.1103/PhysRevMaterials.3.034003
      access: unknown
    entered_by: owner
    entered_on: 2026-11-04

  hazard:
    policy_file: config/hazard_policy.yaml
    status: entered
    entered_by: owner
    entered_on: 2026-10-31

  evidence:
    kind: evidence_tier
    shape: "ordinal tier of the best verified evidence label for the composition; no usable label is missing (unclassified), never 0"
    tiers:
      dielectric_characterized: 1.0
      thin_film_deposited: 0.75
      bulk_synthesized: 0.5
      computed_only: 0.25
    ignored_labels: [not_relevant, no_abstract, unclassified]
    status: entered
    source:
      citation: "Owner decision 2026-11-02 (Track A planning round): score evidence from classifier labels when present, otherwise missing; a design decision, not a chemistry fact. Recorded in docs/DECISIONS.md."
      url: null
      access: not_applicable
    entered_by: owner
    entered_on: 2026-11-02

  deposition_method:
    kind: deposition_method_match
    weight: 0.0
    shape: "1.0 when any evidence hit names a deposition method in the site profile's list, 0.0 when hits name methods and none match, missing otherwise"
    status: entered
    source:
      citation: "Owner decision 2026-11-02: optional criterion, present at weight 0; design decision"
      url: null
      access: not_applicable
    entered_by: owner
    entered_on: 2026-11-02

  cost:
    kind: cost_or_abundance
    weight: 0.0
    status: open
    note: "No public cost or abundance source is wired; the criterion is always missing. Documented extension."
    entered_by: owner
    entered_on: 2026-11-02

weights:
  status: entered
  values:
    stability: 1.0
    band_gap: 1.0
    hazard: 1.0
    simplicity: 1.0
    evidence: 1.0
    dielectric_constant: 0.0
    deposition_method: 0.0
    cost: 0.0
  shape: "total = sum(normalized * weight) / sum(weight) over criteria that have a value; missing criteria contribute nothing and are listed"
  source:
    citation: "Defaults from the Track 0 contract (config/schema.py ScoringProfile) carried into config so the FDE edits them here; optional criteria off per the owner's Track A prompt, 2026-11-02"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-11-02

sensitivity:
  status: entered
  perturbation: 0.2
  shape: "each weighted criterion is rescored at weight x 0.8 and x 1.2, one at a time; the rank range per candidate is reported"
  source:
    citation: "Owner decision 2026-11-02 (Track A prompt): +/-20% per weight"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-11-02

synonyms:
  status: entered
  description: "FDE-owned search terms per composition for the literature query; curated from the recorded PubChem synonym lists."
  source:
    citation: "PubChem synonym lists for the chosen CIDs, recorded 2026-10-31 (fixtures/adapters/pubchem); trivial names chosen by the FDE"
    url: https://pubchem.ncbi.nlm.nih.gov/
    access: open
  terms:
    AlN: [aluminum nitride]
    GaN: [gallium nitride]
    Si3N4: [silicon nitride]
    BN: [boron nitride]
  entered_by: owner
  entered_on: 2026-11-02

anchors:
  status: entered
  compositions: []
  rule: "No anchor for this profile; a site may add its own incumbent."
  source:
    citation: "Owner decision 2026-11-03"
    url: null
    access: not_applicable
  entered_by: owner
  entered_on: 2026-11-03
