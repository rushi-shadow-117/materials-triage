  - id: al2o3_gap_amorphous_ald_range
    composition: Al2O3
    property: band_gap_ev
    value_range: [6.0, 7.0]
    form: amorphous_film
    status: entered
    source:
      citation: "O. A. Dicks, J. Cottom, A. L. Shluger, V. V. Afanas'ev, The origin of negative charging in amorphous Al2O3 films: The role of native defects, arXiv:1811.00610"
      url: https://arxiv.org/abs/1811.00610
      access: open
      quote: "the range of band gaps observed for a-Al2O3 grown using ALD is 6.0 eV - 7.0 eV"
    note: "The paper cites its references 43-45 for the range; it is a review statement, not a new measurement. Quote confirmed against the PDF text on 2026-10-31."
    entered_by: owner
    entered_on: 2026-10-31

  - id: al2o3_gap_amorphous_ald_point
    composition: Al2O3
    property: band_gap_ev
    value: 6.6
    uncertainty: 0.2
    form: amorphous_film
    status: entered
    source:
      citation: "D. Cohen-Azarzar, M. Baskin, L. Kornblum, Band offsets at amorphous-crystalline Al2O3-SrTiO3 oxide interfaces, arXiv:1705.00315"
      url: https://arxiv.org/abs/1705.00315
      access: open
      quote: "The distance of the onset of the energy loss tail from the major O 1s (Al2O3) peak yields a bandgap of 6.6±0.2 eV"
      quote_2: "This value is in agreement with previous reports for amorphous Al2O3."
    note: "Measured by XPS O 1s energy-loss onset on a 10 nm amorphous Al2O3 film on (001) SrTiO3; growth method as stated in the paper, not asserted here. Confirmed in the body text 2026-10-31."
    entered_by: owner
    entered_on: 2026-10-31

  - id: tho2_gap_sputtered_film_evans2006
    composition: ThO2
    property: band_gap_ev
    value: 5.9
    form: thin_film
    status: entered
    source:
      citation: "W. R. Evans, D. D. Allred, et al., Understanding DC-bias sputtered thorium oxide thin films useful in EUV optics, Proc. SPIE (2006); abstract: direct band gap about 5.9 eV, clarifying earlier reports of an absorption edge below 4 eV"
      url: https://scholarsarchive.byu.edu/facpub/990
      access: open
    note: "Owner's assessment: the expt_gap compendium rows for ThO2 (3.30 to 3.50 eV) most likely trace to the older sub-4 eV absorption-edge reports this paper discusses. Recorded as the owner's hypothesis; the compendium rows stay in the data flagged as conflicting."
    entered_by: owner
    entered_on: 2026-10-31

